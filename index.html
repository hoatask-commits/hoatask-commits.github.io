<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI APP</title>
</head>

<body style="
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
">

    <main style="
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 14px 40px;
        box-sizing: border-box;
        text-align: center;
    ">

        <h1 style="
            margin: 0 0 24px;
            font-size: 32px;
            line-height: 1.2;
            letter-spacing: 1px;
        ">
            AI APP
        </h1>

        <section style="
            background: #1a1a1a;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 0 18px rgba(0, 140, 255, 0.18);
        ">

            <img
                src="icon_aisports.png"
                alt="AI Sports app icon"
                style="
                    width: 58px;
                    height: 58px;
                    border-radius: 14px;
                    object-fit: cover;
                "
            >

            <h2 style="
                margin: 14px 0 16px;
                font-size: 23px;
                line-height: 1.3;
            ">
                🏆 AI SPORT - FITNESS TRACKER
            </h2>

            <img
                src="phone11.png"
                alt="AI Sports Fitness Tracker"
                style="
                    display: block;
                    width: 100%;
                    max-width: 430px;
                    height: auto;
                    margin: 0 auto 22px;
                    border-radius: 14px;
                    box-shadow: 0 0 18px rgba(0, 120, 255, 0.24);
                "
            >

            <a
                href="https://play.google.com/store/apps/details?id=com.hoanguyendev.aisports"
                target="_blank"
                rel="noopener noreferrer"
                style="
                    display: inline-block;
                    width: 100%;
                    max-width: 360px;
                    box-sizing: border-box;
                    padding: 14px 22px;
                    border-radius: 10px;
                    background: #1DB954;
                    color: white;
                    font-size: 16px;
                    font-weight: bold;
                    line-height: 1.2;
                    text-decoration: none;
                    box-shadow: 0 0 14px rgba(29, 185, 84, 0.28);
                "
            >
                📲 Download on Google Play
            </a>

        </section>

    </main>

</body>

</html>
